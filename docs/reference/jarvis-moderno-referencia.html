(()=>{
 const root=document.getElementById('jarvis-moderno'),content=root.querySelector('.jd-content'),form=root.querySelector('form'),input=root.querySelector('input');
 const initial=content.innerHTML;let sequence=0;
 const notes={Projetos:['JARVIS · assistente pessoal','Prospect AI · prospecção de empresas'],Tarefas:['Planejar os estudos','Avançar um projeto de programação'],Memória:['Segundo cérebro · Obsidian','Objetivos e ideias de projetos']};
 const sendState=state=>root.dispatchEvent(new CustomEvent('jarvis-state',{detail:state}));
 function select(view){root.querySelector('.jd-current').textContent=view;root.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===view)));}
 function reset(){sequence++;select('Conversa');content.innerHTML=initial;input.value='';root.querySelector('.jd-welcome').hidden=false;sendState('idle');if(typeof lucide!=='undefined')lucide.createIcons({attrs:{width:16,height:16}});}
 function reply(text){const id=++sequence;select('Conversa');root.querySelector('.jd-welcome').hidden=true;content.replaceChildren();const box=document.createElement('div');box.className='jd-chat';const user=document.createElement('strong');user.textContent=text;const answer=document.createElement('div');answer.textContent='Pensando…';box.append(user,answer);content.append(box);sendState('thinking');setTimeout(()=>{if(sequence!==id)return;answer.textContent=/dia|rotina/i.test(text)?'Podemos dividir seu tempo entre estudos, programação e descanso. Na versão final, este espaço mostrará seu plano e as tarefas do dia.':/nota|obsidian/i.test(text)?'Sua memória ficará acessível aqui. Na versão final, o JARVIS poderá consultar as notas que você conectar.':'Vamos continuar seu projeto. Na versão final, as respostas e ações do JARVIS aparecerão nesta conversa.';sendState('speaking');setTimeout(()=>{if(sequence===id)sendState('idle');},3500);},1200);}
 root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.prompt){reply(b.dataset.prompt);return;}if(b.dataset.view){const view=b.dataset.view;sequence++;select(view);sendState('idle');root.querySelector('.jd-welcome').hidden=false;if(view==='Conversa'){reset();return;}content.replaceChildren();const list=document.createElement('div');list.className='jd-list';for(const label of notes[view]){const item=document.createElement('span');item.textContent=label;list.append(item);}content.append(list);}});
 form.addEventListener('submit',e=>{e.preventDefault();const text=input.value.trim();if(text){input.value='';reply(text);}});root.querySelector('.jd-new').addEventListener('click',reset);
 root.querySelector('.jd-mic').addEventListener('click',()=>{const id=++sequence;sendState('listening');setTimeout(()=>{if(sequence===id)reply('Organizar meu dia');},1800);});
})();


</script>
<script>

(()=>{
 const root=document.getElementById('jarvis-moderno');
 const canvas=root.querySelector('canvas'),ctx=canvas.getContext('2d');
 const status=root.querySelector('.jp-status'),pause=root.querySelector('.jp-pause');
 const labels={idle:'Pronto para conversar',listening:'Ouvindo você',thinking:'Organizando as ideias',speaking:'Respondendo'};
 let state='idle',paused=matchMedia('(prefers-reduced-motion: reduce)').matches,time=0,last=0,w=0,h=0,dpr=1,energy=.12,target=.12,rotation=0;
 const seed=Math.random()*5000;
 function hash(n){const v=Math.sin(n*127.1+seed)*43758.5453;return (v-Math.floor(v))*2-1;}
 function noise(t,key){const k=Math.floor(t),u=t-k,s=u*u*(3-2*u);return hash(k+key*31.7)*(1-s)+hash(k+1+key*31.7)*s;}
 const points=[],N=1700,angle=Math.PI*(3-Math.sqrt(5));
 for(let i=0;i<N;i++){const y=1-2*(i+.5)/N,r=Math.sqrt(1-y*y),a=i*angle;points.push({x:Math.cos(a)*r,y,z:Math.sin(a)*r,key:Math.random()*1000,phase:Math.random()*Math.PI*2});}
 function resize(){const box=canvas.getBoundingClientRect();w=box.width;h=box.height;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);draw();}
 function draw(){
  if(!w||!h)return;
  ctx.clearRect(0,0,w,h);
  const t=time,cx=w/2+noise(t*.16,1)*6,cy=h/2+noise(t*.12,3)*7;
  const base=Math.min(w*.29,h*.32)*(1+noise(t*.32,5)*.045);
  const glow=ctx.createRadialGradient(cx,cy,base*.1,cx,cy,base*1.8);
  glow.addColorStop(0,'rgba(87,151,255,.08)');glow.addColorStop(.5,'rgba(121,86,245,.05)');glow.addColorStop(1,'rgba(48,78,150,0)');ctx.fillStyle=glow;ctx.fillRect(0,0,w,h);
  const cr=Math.cos(rotation),sr=Math.sin(rotation),tilt=.18+noise(t*.18,7)*.3,ct=Math.cos(tilt),st=Math.sin(tilt);
  const pulse=noise(t*(state==='speaking'?2.7:.4),9)*energy;
  const drift=.015+energy*.025;
  const projected=points.map(p=>{
   const wave=Math.sin(p.x*4+t*.7+noise(t*.15,11))*Math.cos(p.y*4-t*.5)*Math.sin(p.z*4+t*.3);
   const spread=1+wave*(.055+energy*.09)+noise(t*.5,p.key)*.038+pulse*.06;
   const x0=p.x*spread+noise(t*.4,p.key+1)*drift,y0=p.y*spread+noise(t*.38,p.key+2)*drift,z0=p.z*spread+noise(t*.43,p.key+3)*drift;
   const x=x0*cr+z0*sr,z1=-x0*sr+z0*cr,y=y0*ct-z1*st,z=y0*st+z1*ct;
   const perspective=3.5/(3.5-z);
   return {x:cx+x*base*perspective,y:cy+y*base*perspective,z,r:(.6+(z+1)*.5)*perspective,key:p.key,phase:p.phase};
  }).sort((a,b)=>a.z-b.z);
  for(const p of projected){
   const front=Math.max(0,Math.min(1,(p.z+1)/2)),twinkle=.88+noise(t*.35,p.key+5)*.12;
   const alpha=(.17+front*.73)*twinkle;
   ctx.beginPath();ctx.fillStyle=`rgba(${95+Math.round(45*p.y/h)},${144+Math.round(front*65)},255,${alpha})`;ctx.arc(p.x,p.y,Math.max(.25,p.r),0,Math.PI*2);ctx.fill();
   if(front>.78&&p.phase>6){ctx.beginPath();ctx.fillStyle=`rgba(191,225,255,${alpha*.15})`;ctx.arc(p.x,p.y,p.r*3,0,Math.PI*2);ctx.fill();}
  }
 }
 function frame(ts){const dt=last?Math.min((ts-last)/1000,.05):0;last=ts;if(!paused){time+=dt;energy+=(target-energy)*Math.min(1,dt*4);rotation+=dt*(.12+energy*.15+noise(time*.16,20)*.09);if(w&&h)draw();}requestAnimationFrame(frame);}
 root.addEventListener('jarvis-state',e=>{state=e.detail;target={idle:.12,listening:.48,thinking:.7,speaking:1}[state];status.textContent=labels[state];if(paused){energy=target;draw();}});
 function pauseLabel(){pause.textContent=paused?'Animar':'Pausar';pause.setAttribute('aria-label',paused?'Iniciar animação':'Pausar animação');}
 pause.addEventListener('click',()=>{paused=!paused;pauseLabel();});
 new ResizeObserver(resize).observe(canvas);pauseLabel();resize();requestAnimationFrame(frame);
})();
